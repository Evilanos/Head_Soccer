<!doctype html>
<html lang="id">
<head>

<title>Head Soccer</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;text-align:center;

  .opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
